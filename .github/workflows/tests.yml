name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run functional tests with coverage
      run: |
        pytest tests/functional/ -v --cov=src --cov-report=xml --cov-report=term-missing --junitxml=reports/functional.xml

    - name: Run fault injection tests
      run: |
        pytest tests/fault_injection/ -v --junitxml=reports/fault_injection.xml

    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --junitxml=reports/performance.xml

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.python-version }}
        path: reports/

    - name: Upload coverage report
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
