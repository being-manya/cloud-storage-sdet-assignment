[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    functional: Core functional tests
    boundary: Boundary value analysis tests
    security: Security and injection tests
    concurrency: Threading and race condition tests
    bulk: Bulk operation tests
    fault: Fault injection tests
    tiering: Tier transition tests
